<!doctype html>
<!-- Draws one QR code, for checking js/qr.js against a real scanner: qr.html?text=anything -->
<meta charset="utf-8">
<title>QR check</title>
<style>html, body { margin: 0; background: #fff; } #qr { width: 100vmin; height: 100vmin; } #qr svg { width: 100%; height: 100%; display: block; }</style>
<div id="qr"></div>
<script type="module">
  import {qrSvg} from '../js/qr.js';
  const text = new URLSearchParams(location.search).get('text') || 'https://angusthomaspaterson.github.io/back-announce/';
  document.getElementById('qr').innerHTML = qrSvg(text, {dark: '#000000'});
</script>
