name: Probe (temporary)

on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Try Substack from ${{ matrix.os }}
        shell: bash
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36"
          try() { printf '%-60s ' "$1"; curl -s -o body.tmp -w '%{http_code} %{size_download}b\n' -A "$UA" -H "Accept: */*" --compressed "$1"; head -c 100 body.tmp | tr '\n' ' '; echo; }
          curl -s https://api.ipify.org; echo " <- runner address"
          try "https://firstfloor.substack.com/feed"
          try "https://toneglow.substack.com/feed"
          try "https://api.substack.com/feed/podcast/2037294.rss"
          try "https://daily.bandcamp.com/"
          try "https://bandcamp.com/radio"
