name: Publish the web app

# Publishes web/ plus data/ to GitHub Pages. Runs when either changes on main,
# when asked by hand, and after every feed refresh (gather.yml starts it).
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "data/*.json"
      - "data/feed/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only the newest deploy matters.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Build and deploy are separate jobs (GitHub's standard layout). In one job, the deploy
  # step sometimes looked for the uploaded site a fraction of a second after the upload
  # and found nothing (failing runs on 23 to 25 Nov 2026).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r web/. _site/
          # Local-only test files and the pretend GitHub stay off the published site.
          rm -rf _site/tests _site/js/dev-mock.js _site/data
          mkdir -p _site/data/feed
          cp data/*.json _site/data/
          cp data/feed/*.json _site/data/feed/
          # A visitor's starting point is the list of paused sources and nothing more.
          # Angus's Saved list and seen marker stay off the site (his own devices read
          # them through the API with a token), and so does the summary made for Claude.
          python3 -c "import json; s = json.load(open('data/state.json')); json.dump({'paused': s.get('paused', []), 'saved': {}, 'lastSeen': None}, open('_site/data/state.json', 'w'))"
          rm -f _site/data/glance.json
          # Stamp the service worker with a fingerprint of the app's own files, so the
          # cached shell is replaced when the app changes but not on every feed refresh.
          build=$(cd _site && find . -type f -not -path './data/*' -not -name version.txt | sort | xargs sha1sum | sha1sum | cut -c1-12)
          sed -i "s/__BUILD__/${build}/" _site/sw.js
          echo "${build}" > _site/version.txt

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
