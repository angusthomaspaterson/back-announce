name: Gather the feed

on:
  schedule:
    # Every 6 hours. GitHub runs cron in UTC; minute 17 avoids the busy top of the hour.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never run two gathers at once; a second one waits for the first.
concurrency:
  group: gather
  cancel-in-progress: false

jobs:
  gather:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run the parser tests
        run: python3 -m unittest discover -s gatherer/tests

      - name: Gather every source
        run: python3 gatherer/gather.py --data data

      - name: Commit and push
        run: |
          git config user.name "Back Announce gatherer"
          git config user.email "gatherer@users.noreply.github.com"
          git add data/feed data/status.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          stamp=$(TZ=Australia/Perth date "+%a %-d %b %H:%M AWST")
          git commit -m "feed: refresh $stamp"
          # The apps may have pushed a change to state.json or sources.json while we
          # were running. Rebase onto whatever is there now and try again, a few times.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), rebasing..."
            git pull --rebase
          done
          echo "Could not push after 5 attempts." >&2
          exit 1
