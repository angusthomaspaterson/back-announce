name: Gather the feed

on:
  schedule:
    # Once a day at 21:17 UTC, which is 5:17 am in Perth. Minute 17 avoids the busy top of
    # the hour; GitHub can still start it a little late.
    - cron: "17 21 * * *"
  workflow_dispatch:
  # When the app adds or edits a source, gather straight away so its episodes appear.
  push:
    branches: [main]
    paths:
      - "data/sources.json"

permissions:
  contents: write
  actions: write

# Never run two gathers at once; a second one waits for the first.
concurrency:
  group: gather
  cancel-in-progress: false

jobs:
  gather:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run the parser tests
        run: python3 -m unittest discover -s gatherer/tests

      - name: Gather, commit and push
        # Substack and YouTube refuse requests from GitHub's servers, so those sources
        # are gathered by the helper on Angus's laptop (tools/laptop-substack.ps1).
        # If the push is rejected because the apps or the laptop pushed first,
        # start again from the newest commit rather than trying to merge.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Back Announce gatherer"
          git config user.email "gatherer@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            python3 gatherer/gather.py --data data --skip substack.com,youtube.com
            git add data/feed data/status.json data/bundle.json data/glance.json
            if git diff --cached --quiet; then
              echo "Nothing changed."
              exit 0
            fi
            stamp=$(TZ=Australia/Perth date "+%a %-d %b %H:%M AWST")
            git commit -q -m "feed: refresh $stamp"
            if git push; then
              # A push made with the workflow's own token does not start other
              # workflows, so ask for the web app to be republished explicitly.
              gh workflow run pages.yml || echo "Could not start the Pages deploy (is Pages enabled?)"
              exit 0
            fi
            echo "Push rejected (attempt $attempt); refreshing from the newest commit..."
            git fetch origin
            git reset -q --hard origin/main
          done
          echo "Could not push after 5 attempts." >&2
          exit 1
